name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest

      - name: Build Docker images
        run: docker compose build

      - name: Tag Docker images
        run: |
          docker tag enterprise-data-engine-backend ghcr.io/${{ github.repository_owner }}/enterprise-data-engine-backend:${{ github.sha }}
          docker tag enterprise-data-engine-frontend ghcr.io/${{ github.repository_owner }}/enterprise-data-engine-frontend:${{ github.sha }}

      - name: Verify Docker image tags
        run: docker images

      - name: Push Docker images to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/enterprise-data-engine-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/enterprise-data-engine-frontend:${{ github.sha }}
