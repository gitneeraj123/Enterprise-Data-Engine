services:
  backend:
    build: ./backend
    container_name: enterprise_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: enterprise_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
